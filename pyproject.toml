[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock_claude_usage"
version = "0.1.0"
description = "AWS Bedrock Claude使用量取得CLIツール"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["aws", "bedrock", "claude", "cloudwatch", "metrics", "cli", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "boto3>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/bedrock_claude_usage"
Repository = "https://github.com/YOUR_USERNAME/bedrock_claude_usage"
Issues = "https://github.com/YOUR_USERNAME/bedrock_claude_usage/issues"

[project.scripts]
bedrock_claude_usage = "bedrock_claude_usage.cli:main"

[tool.setuptools]
packages = ["bedrock_claude_usage"]

[tool.setuptools.package-data]
bedrock_claude_usage = ["models_config.json"]
